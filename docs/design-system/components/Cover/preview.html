<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VORA Design System</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .band { position: absolute; left: 0; top: 0; width: 960px; height: 112px; }
  .band svg { display: block; width: 960px; height: 112px; }
  .deep { fill: var(--lagoon-600); }
  .jade { fill: var(--lagoon-500); }
  .lagoon { fill: var(--lagoon-300); }
  .dusk { fill: var(--dusk-600); }
  .relief { fill: var(--color-text); }
  .blk { rx: var(--radius-0); }
  .rule { fill: var(--color-line-strong); }
  .words { position: absolute; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); }
  .name { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: 64px; line-height: 0.95; letter-spacing: -0.035em; color: var(--color-text); white-space: nowrap; }
  .tag { margin: var(--space-2) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--color-text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      lagoon-600 176×128 (the deep teal slab, bled off the top) · lagoon-500 240×96 (jade, the mark's middle) · lagoon-300 96×80 (the UI accent, kept narrow) · dusk-600 144×128 bled off the right (the mark's indigo edge) · color-text 64×48 (relief; inverts with the theme) — about 30% of 960×288
  arrangement a strip of unequal bands across the top, like strata or terraces seen in section, bottoms stepped so the band reads as terrain; space-4 gutters
  pattern     hairline rules, from "The survey line": one horizon rule across the whole band at 72 plus four ticks at a space-8 × 3 pitch — the system's one drawn device, in color-line-strong
  scales      widths space-11 / space-12 / space-9 / space-8 multiples; gutter space-4; tick pitch 192 (3 × space-8); corners radius-0 (a square system)
-->
<rect class="deep blk" x="0" y="-16" width="176" height="128"/>
<rect class="jade blk" x="192" y="16" width="240" height="96"/>
<rect class="relief blk" x="448" y="64" width="64" height="48"/>
<rect class="lagoon blk" x="528" y="32" width="96" height="80"/>
<rect class="dusk blk" x="816" y="-16" width="144" height="128"/>
<rect class="rule" x="0" y="72" width="960" height="1"/>
<rect class="rule" x="96" y="66" width="1" height="13"/>
<rect class="rule" x="288" y="66" width="1" height="13"/>
<rect class="rule" x="480" y="66" width="1" height="13"/>
<rect class="rule" x="672" y="66" width="1" height="13"/>
</svg>
</div>
<div class="words">
<h1 class="name">VORA Design System</h1>
<p class="tag">Digital architecture in natural light.</p>
</div>
</div>
</body>
</html>
