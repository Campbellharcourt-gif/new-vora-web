<!-- @dsCard group="Feedback" height=250 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusIndicator — preview</title></head>
<body>
<div class="v-stage">
  <div class="v-row" style="gap:var(--space-6)"><span class="v-status v-status--ok">Operational</span><span class="v-status v-status--warn">Degraded</span><span class="v-status v-status--down">Unavailable</span><span class="v-status v-status--muted">Not in use</span></div>
  <div class="v-row" style="gap:var(--space-6)"><span class="v-status v-status--info">Received</span><span class="v-status v-status--warn">Processing</span><span class="v-status v-status--info">Contacted</span><span class="v-status v-status--ok">Qualified</span><span class="v-status v-status--ok">Won</span><span class="v-status v-status--muted">Lost</span><span class="v-status v-status--muted">Archived</span></div>
  <div data-theme="mist" style="padding:var(--space-5)" class="v-row"><span class="v-status v-status--muted">Draft</span><span class="v-status v-status--ok">Published</span><span class="v-status v-status--warn">Changes</span><span class="v-status v-status--down">Unavailable</span></div>
</div>

</body>
</html>
