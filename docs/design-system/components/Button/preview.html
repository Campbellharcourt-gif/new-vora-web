<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="v-stage">
  <div class="v-row">
    <a class="v-btn v-btn--primary" href="#">Start a project<svg class="v-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h12M9.5 4l4 4-4 4"/></svg></a>
    <a class="v-btn v-btn--secondary" href="#">See the work</a>
    <button class="v-btn v-btn--quiet" type="button">View all</button>
  </div>
  <div class="v-row">
    <button class="v-btn v-btn--primary" type="button" aria-busy="true" style="width:168px">Sending…</button>
    <button class="v-btn v-btn--primary" type="button" aria-disabled="true" aria-describedby="why">Send enquiry</button>
    <span id="why" class="v-body-s">Add a message to send</span>
  </div>
  <div class="v-row">
    <a class="v-btn v-btn--secondary v-btn--s" href="#">Start a project<svg class="v-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h12M9.5 4l4 4-4 4"/></svg></a>
    <a class="v-btn v-btn--primary v-btn--l" href="#">Start a project<svg class="v-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h12M9.5 4l4 4-4 4"/></svg></a>
  </div>
  <div data-theme="mist" style="padding:var(--space-5)" class="v-row">
    <span class="v-caption" style="width:100%">Workspace (Mist)</span>
    <button class="v-btn v-btn--primary v-btn--s" type="button">Save</button>
    <button class="v-btn v-btn--secondary v-btn--s" type="button">Cancel</button>
    <button class="v-btn v-btn--danger v-btn--s" type="button">Deactivate user</button>
  </div>
</div>

</body>
</html>
