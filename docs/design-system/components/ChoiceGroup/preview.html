<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChoiceGroup — preview</title></head>
<body>
<div class="v-stage" style="grid-template-columns:1fr 1fr;align-items:start">
  <fieldset class="v-fieldset"><legend class="v-field__label">What do you need?</legend><div class="v-choices"><label class="v-choice"><input type="checkbox" name="t" checked>Website or digital platform</label><label class="v-choice"><input type="checkbox" name="t">Branding</label><label class="v-choice"><input type="checkbox" name="t">Motion</label><label class="v-choice"><input type="checkbox" name="t">Film</label><label class="v-choice"><input type="checkbox" name="t">Not sure yet</label></div></fieldset>
  <fieldset class="v-fieldset"><legend class="v-field__label">Timeline</legend><div class="v-choices"><label class="v-choice"><input type="radio" name="tl">As soon as possible</label><label class="v-choice"><input type="radio" name="tl">Within 2–4 weeks</label><label class="v-choice"><input type="radio" name="tl" checked>1–2 months</label><label class="v-choice"><input type="radio" name="tl">Flexible</label><label class="v-choice"><input type="radio" name="tl">By a specific date</label></div></fieldset>
</div>

</body>
</html>
