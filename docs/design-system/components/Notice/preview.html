<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Notice — preview</title></head>
<body>
<div class="v-stage">
  <div class="v-notice" role="status"><span class="v-status v-status--info">Notice</span><p>New enquiries are paused during scheduled maintenance. <a class="v-link" href="#">See status</a>.</p></div>
  <div class="v-notice" role="alert"><span class="v-status v-status--down">Error</span><p>The note wasn't saved. Check your connection, then save again.</p></div>
  <div data-theme="mist" style="padding:var(--space-5)"><div class="v-notice" role="status"><span class="v-status v-status--ok">Saved</span><p>Status changed to Qualified.</p></div></div>
  <p class="v-caption">Example messages</p>
</div>

</body>
</html>
